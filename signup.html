<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Deon George</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <h2 class="logo">Deon George</h2>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="gallery.html">My Gallery</a></li>
            <li><a href="contact.html">Contact Me</a></li>
            <li><a href="signup.html">Sign Up</a></li>
        </ul>
    </nav>
</header>

<section class="page-title">
    <h1>Create an Account</h1>
    <p>Register to connect with my portfolio.</p>
</section>

<section class="signup-container">

<form class="signup-form">

    <div class="form-group">
        <label>First Name</label>
        <input type="text" name="firstname">
    </div>

    <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="lastname">
    </div>

    <div class="form-group">
        <label>Username</label>
        <input type="text" name="username">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" name="password">
    </div>

    <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm-password">
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone">
    </div>

    <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="dob">
    </div>

    <div class="form-group">
        <label>Gender</label>

        <div class="radio-group">
            <label>
                <input type="radio" name="gender" value="male">
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="female">
                Female
            </label>

            <label>
                <input type="radio" name="gender" value="other">
                Other
            </label>
        </div>
    </div>

    <div class="form-group">
        <label>Address</label>
        <textarea name="address" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label>City</label>
        <input type="text" name="city">
    </div>

    <div class="form-group">
        <label>State</label>
        <select name="state">

            <option value="">Select State</option>
            <option>Kerala</option>
            <option>Tamil Nadu</option>
            <option>Karnataka</option>
            <option>Maharashtra</option>
            <option>Other</option>

        </select>
    </div>

    <div class="form-group">
        <label>Country</label>
        <input type="text" name="country">
    </div>

    <div class="form-group">
        <label>Pincode</label>
        <input type="number" name="pincode">
    </div>

    <div class="form-group">
        <label>College</label>
        <input type="text" name="college">
    </div>

    <div class="form-group">
        <label>Course</label>
        <input type="text" name="course">
    </div>

    <div class="form-group">
        <label>Year of Study</label>

        <select name="year">
            <option>Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

    </div>

    <div class="form-group">
        <label>Favourite Programming Language</label>

        <select name="language">
            <option>Python</option>
            <option>C</option>
            <option>Java</option>
            <option>JavaScript</option>
            <option>C++</option>
        </select>

    </div>

    <div class="form-group">
        <label>Profile Photo</label>
        <input type="file" name="photo">
    </div>

    <div class="form-group full-width">

        <label>Interests</label>

        <div class="checkbox-group">

            <label>
                <input type="checkbox" name="interest" value="coding">
                Programming
            </label>

            <label>
                <input type="checkbox" name="interest" value="cybersecurity">
                Cyber Security
            </label>

            <label>
                <input type="checkbox" name="interest" value="ai">
                AI / ML
            </label>

            <label>
                <input type="checkbox" name="interest" value="design">
                Designing
            </label>

        </div>

    </div>

    <div class="form-group full-width">

        <label>About Yourself</label>

        <textarea name="about" rows="5"
            placeholder="Tell us something about yourself"></textarea>

    </div>

    <div class="form-group full-width">

        <label>
            <input type="checkbox" name="terms">
            I agree to the terms and conditions.
        </label>

    </div>

    <div class="form-buttons">

        <button type="submit">Register</button>

        <button type="reset" class="reset-btn">
            Reset
        </button>

    </div>

</form>

</section>

<footer>
    <p>© 2026 Deon George | Professional Portfolio</p>
</footer>

</body>
</html>
